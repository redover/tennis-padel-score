name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Test logica punteggio
        run: ./gradlew :core:test
      - name: Compila APK
        run: ./gradlew :wear:assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: punteggio-debug-apk
          path: wear/build/outputs/apk/debug/*.apk
      # Su un tag vX.Y.Z pubblica l'APK in una release, scaricabile senza login.
      - name: Pubblica release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp wear/build/outputs/apk/debug/wear-debug.apk "Punteggio-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "Punteggio-${GITHUB_REF_NAME}.apk" \
            --title "Punteggio ${GITHUB_REF_NAME}" \
            --notes "Scarica Punteggio-${GITHUB_REF_NAME}.apk e installalo sull'orologio."
