name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Test logica punteggio
        run: ./gradlew :core:test
      - name: Compila APK
        run: ./gradlew :wear:assembleDebug
      - name: Screenshot dell'app
        run: ./gradlew :wear:recordPaparazziDebug
      # Su main, pubblica le immagini nel branch "screenshots" per vederle senza scaricare nulla.
      - name: Pubblica screenshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/shots && cp wear/src/test/snapshots/images/*.png /tmp/shots/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan screenshots
          git rm -rf --quiet .
          cp /tmp/shots/*.png .
          git add *.png
          git commit -m "Screenshot di ${GITHUB_SHA::7}"
          git push --force origin screenshots
      - uses: actions/upload-artifact@v5
        with:
          name: punteggio-debug-apk
          path: wear/build/outputs/apk/debug/*.apk
      # Quando si pubblica una release, ci allega l'APK (scaricabile senza login).
      - name: Allega APK alla release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp wear/build/outputs/apk/debug/wear-debug.apk "Punteggio-${TAG}.apk"
          gh release upload "$TAG" "Punteggio-${TAG}.apk" --clobber
